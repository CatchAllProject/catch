<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/register.css">
    <title>Registro // Save Reader</title>
</head>
<body>
    <div class="nav_area">
        <div class="nav_left">
            <div class="logo">
                <img
                    src="../public/images/dex_logo.png"
                    alt="logo"
                >
            </div>
            <div class="nav_links">
                <a href="index.html">
                    Reader
                </a>
                <a href="">
                    Pokédex
                </a>
                <a href="about.html">
                    Sobre
                </a>
            </div>
        </div>
        <div class="nav_search">

            <span class="search_icon">
                /
            </span>
            <input
                type="search"
                placeholder="Pesquisar..."
            >
        </div>
        <div class="nav_right">
            <div class="nav_status">
                <span class="status_light"></span>
                READY
            </div>
            <a
                href="https://github.com/CatchAllProject/catch"
                target="_blank">
                GitHub
            </a>
            <a href="login.html">
                Login
            </a>
        </div>
    </div>
    <main class="register_container">
        <div class="register_header">
            <span class="register_tag">
                USER REGISTRATION // 01
            </span>
            <h1>
                Registro
            </h1>
            <p>
                CRIE SUA CONTA NO SAVE READER
            </p>
        </div>
        <section class="register_card">
            <div class="register_card_header">
                <span>
                    NEW USER
                </span>
                <span>
                    CREATE
                </span>
            </div>
            <form class="register_form">
                <div class="input_group">
                    <label for="username">
                        USERNAME
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="trainerName"
                        autocomplete="username"
                        required
                    >
                </div>
                <div class="input_group">

                    <label for="email">
                        E-MAIL
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="trainer@example.com"
                        autocomplete="email"
                        required
                    >
                </div>
                <div class="password_row">
                    <div class="input_group">
                        <label for="password">
                            PASSWORD
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="new-password"
                            required
                        >
                    </div>
                    <div class="input_group">
                        <label for="password_confirm">
                            CONFIRM
                        </label>
                        <input
                            type="password"
                            id="password_confirm"
                            name="password_confirm"
                            placeholder="••••••••"
                            autocomplete="new-password"
                            required
                        >
                    </div>
                </div>
                <label class="terms">
                    <input
                        type="checkbox"
                        name="terms"
                        required
                    >
                    <span>
                        ACEITO OS
                        <a href="">
                            TERMOS DE USO
                        </a>
                        E A
                        <a href="">
                            POLÍTICA DE PRIVACIDADE
                        </a>
                    </span>
                </label>
                <button
                    type="button"
                    class="register_button"
                    id="register_button">
                    <span>
                        ▶
                    </span>
                    CRIAR CONTA
                </button>
            </form>
            <div class="register_divider">
                <span>
                    JÁ POSSUI UMA CONTA?
                </span>
            </div>
            <div class="login_area">
                <a href="login.html">
                    ◀ VOLTAR PARA LOGIN
                </a>
            </div>
        </section>
        <div class="register_status">
            <span>
                ● AUTH SERVER
                <strong>ONLINE</strong>
            </span>
            <span>
                REGISTRATION
                <strong>OPEN</strong>
            </span>
            <span>
                VERSION
                <strong>0.1.0</strong>
            </span>
        </div>
    </main>
    <footer class="register_footer">
        <span>
            CATCHALL PROJECT
        </span>
        <span>
            SAVE READER // USER REGISTRATION
        </span>
        <span>
            v0.1.0
        </span>
    </footer>
</body>
</html>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../back/auth/supabase.js"></script>
<script src="../../back/auth/auth.js"></script>
